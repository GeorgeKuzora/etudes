[project]
name = "functional"
version = "0.1.0"
description = "For functional fun"
authors = [
    {name = "GeorgiyKuzora",email = "georgiy@kuzora.ru"}
]
requires-python = "~=3.14"
dependencies = [
    "ruff (>=0.15.17,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "returns (>=0.28.0,<0.29.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ty (>=0.0.49,<0.0.50)",
    "pytest (>=9.1.0,<10.0.0)",
    "memory-profiler (>=0.61.0,<0.62.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
plugins = ["returns.contrib.mypy.returns_plugin"]
